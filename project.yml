name: Slate
options:
  bundleIdPrefix: app.slate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Slate:
    type: application
    platform: iOS
    sources:
      - path: Slate
    info:
      path: Slate/Info.plist
      properties:
        CFBundleDisplayName: Slate
        CFBundleName: Slate
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Slate records lectures so you can tap your notes later and hear what was being said.
        NSPhotoLibraryUsageDescription: Slate adds photos you choose to your notebook pages.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.slate.notes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SlateTests
    dependencies:
      - target: Slate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.slate.notes.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Slate.app/Slate"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SlateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SlateUITests
    dependencies:
      - target: Slate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.slate.notes.uitests
        TEST_TARGET_NAME: Slate
schemes:
  Slate:
    build:
      targets:
        Slate: all
        SlateTests: [test]
        SlateUITests: [test]
    test:
      config: Debug
      targets:
        - SlateTests
        - SlateUITests
